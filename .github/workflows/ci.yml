name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --all-features

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-bin: true

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Audit dependencies
      # RUSTSEC-2023-0071: rsa via sqlx-mysql; no fix available upstream, we don't use MySQL
      # RUSTSEC-2025-0134: rustls-pemfile unmaintained; transitive via AWS SDK hyper-rustls
      run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Check licenses and advisories
      run: cargo deny check

  deps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-bin: true

    - name: Install cargo-machete
      run: cargo install cargo-machete --locked

    - name: Check for unused dependencies
      run: cargo machete
