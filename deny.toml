[advisories]
version = 2
# All advisory types (vulnerability, unmaintained, unsound) deny by default in v2.
# Exceptions must be listed explicitly below.
ignore = [
    # rustls-pemfile: unmaintained, pulled transitively by AWS SDK via hyper-rustls 0.24.
    { id = "RUSTSEC-2025-0134", reason = "Transitive via AWS SDK; no direct upgrade path available" },
]

[licenses]
version = 2
# Licenses seen across this project's dependency tree
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
]

[bans]
# Warn on duplicate versions of the same crate; the AWS SDK pulls in several
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
