[advisories]
version = 2
# Vulnerability advisories are hard errors; unmaintained/yanked are warnings
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"

[licenses]
version = 2
# Licenses seen across this project's dependency tree
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "OpenSSL",
    "CC0-1.0",
    "Zlib",
]

[bans]
# Warn on duplicate versions of the same crate; the AWS SDK pulls in several
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
